{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<h1>Register</h1>
<form method="post">
  <label>Name <input name="name" required></label>
  <label>Email <input name="email" type="email" required></label>
  <label class="check"><input type="checkbox" name="needs_accessible"> I need an accessible space</label>
  <button type="submit">Register</button>
</form>
{% endblock %}
